name: tayyibt
description: Tayyibt - AI-powered matchmaking app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  go_router: ^12.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  socket_io_client: ^2.0.3
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  intl: any
  image_picker: ^1.0.0
  google_fonts: ^6.1.0
  # Reels/Watch/story-video playback -- the official Flutter plugin, no
  # dependency existed for video playback before this phase (image_picker
  # already covers picking a video file, just not playing one back).
  video_player: ^2.9.0
  # 1:1 voice/video calling (this phase) -- the standard, actively-maintained
  # Flutter WebRTC plugin. No other way to do real getUserMedia/RTCPeerConnection
  # in Flutter; mirrors web's browser-native WebRTC APIs used in
  # web/src/features/call/CallProvider.tsx.
  flutter_webrtc: ^0.11.0
  # Runtime mic/camera permission prompts before starting/accepting a call.
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  # Ring-timeout unit test (CallNotifier) needs to fast-forward a real Timer
  # without a 40s sleep; already resolved transitively via flutter_test, but
  # declared directly since the test imports it.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
