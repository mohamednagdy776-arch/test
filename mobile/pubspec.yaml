name: tayyibt
description: Tayyibt - AI-powered matchmaking app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  go_router: ^12.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  socket_io_client: ^2.0.3
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  intl: any
  image_picker: ^1.0.0
  google_fonts: ^6.1.0
  # Reels/Watch/story-video playback -- the official Flutter plugin, no
  # dependency existed for video playback before this phase (image_picker
  # already covers picking a video file, just not playing one back).
  video_player: ^2.9.0
  # 1:1 voice/video calling (this phase) -- the standard, actively-maintained
  # Flutter WebRTC plugin. No other way to do real getUserMedia/RTCPeerConnection
  # in Flutter; mirrors web's browser-native WebRTC APIs used in
  # web/src/features/call/CallProvider.tsx.
  # Pinned >=1.0.0 (not ^0.11.0) -- 0.11.7's Android source unconditionally
  # imports the legacy v1-embedding `PluginRegistry.Registrar` class, which
  # this Flutter engine no longer ships (confirmed via a real CI run:
  # "cannot find symbol: class Registrar" in FlutterWebRTCPlugin.java,
  # mobile-ci run 30632725256). 1.x dropped the v1-embedding code path; the
  # Dart-facing API used here (RTCPeerConnection/MediaStream/RTCIceCandidate/
  # RTCSessionDescription/navigator.mediaDevices/RTCVideoRenderer) is
  # unchanged across the bump.
  flutter_webrtc: ^1.0.0
  # Runtime mic/camera permission prompts before starting/accepting a call.
  permission_handler: ^11.3.0
  # Native OS share sheet for the post-card "Share" menu item (this phase) --
  # web's own Share button opens an in-app modal (repost-to-feed / send-to-
  # friend-in-chat, see PostCard.tsx's ShareModal), which isn't a mobile-
  # native pattern; share_plus gives the equivalent "get this content out of
  # the app" affordance the OS way, sharing the post's content + permalink.
  share_plus: ^10.1.4
  # Opens the OS mail client for the support email row in
  # help_settings_screen.dart (Phase 29) via a mailto: URI. Not present
  # before this phase -- Phase 28 deliberately skipped adding it for a
  # single static link; now needed for real functionality instead of
  # reference-only text.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Real-device/emulator smoke test (mobile-ci.yml's mobile-android-emulator
  # job) -- boots the actual app on a booted AVD, not a widget-test harness.
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  # Ring-timeout unit test (CallNotifier) needs to fast-forward a real Timer
  # without a 40s sleep; already resolved transitively via flutter_test, but
  # declared directly since the test imports it.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
