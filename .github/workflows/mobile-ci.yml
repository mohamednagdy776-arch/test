name: Mobile CI

# Separate from ci.yml (Node-only) -- Flutter needs its own toolchain and
# job matrix (Android on ubuntu-latest, iOS build-only on macos-latest per
# the mobile build plan's locked decision: no Apple Developer account yet,
# so no signing/TestFlight, build-only via --no-codesign).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # AGP 8.11.1 (bundled by `flutter create`'s Android scaffold) doesn't
      # support the Gradle 9.x line that ships with newer JDKs -- Gradle
      # 8.14 needs JDK 21, matching the local dev fix (setup-android-sdk.ps1
      # / flutter config --jdk-dir).
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Baked with the live VPS API/WS URLs, not the defaults (10.0.2.2,
      # which only resolves inside the Android emulator) -- so the artifact
      # below is directly sideloadable onto a real device for the Phase 10
      # manual verification pass. WS_URL was missed in an earlier version of
      # this step, leaving chat/socket features pointed at 10.0.2.2 on a
      # real device even though the REST API URL was correct.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_URL=https://145-14-158-100.sslip.io/api/v1 --dart-define=WS_URL=https://145-14-158-100.sslip.io

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tayyibt-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Real on-device smoke test -- closes the "never verified on an actual
  # device/emulator" gap that stood open through the whole mobile build (no
  # Android emulator or iOS simulator was ever available in the dev
  # environment). `needs: mobile-android` so a slow emulator boot never
  # starts if the cheap analyze/test/build step already failed. Deliberately
  # does NOT log in against the live backend -- see app_smoke_test.dart for
  # why (shared QA accounts have already hit real rate-limit/2FA lockouts).
  mobile-android-emulator:
    runs-on: ubuntu-latest
    needs: mobile-android
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # GitHub-hosted ubuntu-latest runners support nested virtualization for
      # public repos -- without KVM the AVD falls back to slow software
      # emulation and can time out before ever finishing boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on a booted Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: mobile
          script: flutter test integration_test/app_smoke_test.dart

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Build-only -- no APPLE_TEAM_ID / distribution cert / provisioning
      # profile exist yet, so signing is out of scope until the user has an
      # Apple Developer Program account.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
